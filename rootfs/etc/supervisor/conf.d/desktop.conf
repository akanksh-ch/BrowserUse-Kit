[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true

[program:xvnc]
user=agent
environment=HOME=/home/agent
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_RESOLUTION)s -depth 24 -rfbauth /home/agent/.vnc/passwd -SecurityTypes VncAuth -localhost yes -AlwaysShared
autorestart=true
priority=10

[program:dbus]
user=agent
command=/bin/bash -c "rm -f /tmp/dbus-session; exec dbus-daemon --session --nofork --address=$DBUS_SESSION_BUS_ADDRESS"
autorestart=true
priority=5

[program:xfce]
user=agent
environment=HOME=/home/agent,DISPLAY=":1"
command=/bin/bash -c "until xrdb -query >/dev/null 2>&1; do sleep 0.5; done; rm -rf ~/.cache/sessions; exec startxfce4"
autorestart=true
priority=20
startsecs=3

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
autorestart=true
priority=30

[program:chromium]
user=agent
environment=HOME=/home/agent,DISPLAY=":1"
command=/bin/bash -c "until xrdb -query >/dev/null 2>&1; do sleep 1; done; sleep 5; rm -f /home/agent/.chromium-profile/Singleton*; exec chromium"
autorestart=true
priority=40
